<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ResolveAI Store</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        RESOLVE<span>AI</span>
        <span class="logo-sub">Store</span>
      </a>
      <ul class="nav-links">
        <li><a href="/pages/store.html" class="nav-link">Shop</a></li>
        <li><a href="/pages/orders.html" class="nav-link active">My Orders</a></li>
        <li>
          <a href="/pages/cart.html" class="btn btn-secondary" style="padding: 0.4rem 1rem; border-radius: 8px;">
            Cart (<span id="cart-count">0</span>)
          </a>
        </li>
      </ul>
    </div>
  </header>

  <main>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem;">Order History</h1>

    <div class="card" style="margin-bottom: 2rem; padding: 1.25rem;">
      <p style="color: var(--text-secondary); font-size: 0.95rem;">
        Logged in as seeded user: <strong>John Doe</strong> (john@example.com). Below are your recent purchase order transactions.
      </p>
    </div>

    <div class="grid" id="orders-container">
      <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
        Loading your order history...
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ResolveAI. Hackathon Project. Powered by Google Gemini.</p>
  </footer>

  <script type="module">
    import { api } from '/js/api.js';
    import { state } from '/js/state.js';

    document.getElementById('cart-count').innerText = state.getCartCount();

    const fetchOrders = async () => {
      const container = document.getElementById('orders-container');
      try {
        const orders = await api.get('/api/orders');
        container.innerHTML = '';

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 3rem;">
              <span style="font-size: 3rem;">📦</span>
              <h3 class="card-title" style="margin-top: 1rem;">No orders found</h3>
              <p class="card-desc">You haven't placed any orders yet.</p>
              <a href="/" class="btn btn-primary">Go to Shop</a>
            </div>
          `;
          return;
        }

        orders.forEach(order => {
          const date = new Date(order.orderDate || order.createdAt).toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          const itemsText = order.items.map(item => `${item.name} (x${item.quantity})`).join(', ');

          const card = document.createElement('div');
          card.className = 'card';
          card.style.display = 'flex';
          card.style.justifyContent = 'space-between';
          card.style.alignItems = 'center';
          card.style.gap = '1.5rem';

          card.innerHTML = `
            <div style="flex-grow: 1;">
              <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                <span class="badge badge-${order.status.toLowerCase()}">${order.status}</span>
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Ordered on ${date}</span>
              </div>
              <h3 class="card-title" style="font-size: 1.1rem; margin-bottom: 0.25rem;">Order #${order._id}</h3>
              <p style="font-size: 0.9rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 600px;">
                ${itemsText}
              </p>
            </div>
            <div style="text-align: right; min-width: 140px;">
              <div style="font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem;">₹${order.totalAmount.toFixed(2)}</div>
              <a href="/pages/order.html?id=${order._id}" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem; border-radius: 8px;">
                View Order Details
              </a>
            </div>
          `;
          
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="card" style="color:var(--accent-danger); text-align:center;">Failed to load order history: ${err.message}</div>`;
      }
    };

    fetchOrders();
  </script>
</body>
</html>
