<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - ResolveAI Store</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        RESOLVE<span>AI</span>
        <span class="logo-sub">Store</span>
      </a>
      <ul class="nav-links">
        <li><a href="/pages/store.html" class="nav-link">Shop</a></li>
        <li><a href="/pages/orders.html" class="nav-link">My Orders</a></li>
        <li>
          <a href="/pages/cart.html" class="btn btn-secondary active" style="padding: 0.4rem 1rem; border-radius: 8px;">
            Cart (<span id="cart-count">0</span>)
          </a>
        </li>
      </ul>
    </div>
  </header>

  <main>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem;">Shopping Cart</h1>
    
    <div class="cart-split" id="cart-content">
      <!-- Loaded dynamically via script -->
      <div style="text-align: center; grid-column: 1/-1; padding: 4rem; color: var(--text-secondary);">
        Loading cart items...
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ResolveAI. Hackathon Project. Powered by Google Gemini.</p>
  </footer>

  <script type="module">
    import { state } from '/js/state.js';

    const updateCartCount = () => {
      document.getElementById('cart-count').innerText = state.getCartCount();
    };

    updateCartCount();

    const renderCart = () => {
      const container = document.getElementById('cart-content');
      const cart = state.getCart();

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="card" style="grid-column: 1/-1; text-align: center; padding: 3rem;">
            <span style="font-size: 3.5rem;">🛒</span>
            <h3 class="card-title" style="margin-top: 1rem;">Your cart is empty</h3>
            <p class="card-desc">Add some items from our shop to get started.</p>
            <a href="/" class="btn btn-primary">Go to Shop</a>
          </div>
        `;
        return;
      }

      let itemsHtml = '';
      cart.forEach(item => {
        let imgMarkup = '';
        if (item.image && (item.image.startsWith('http') || item.image.startsWith('/') || item.image.includes('.'))) {
          imgMarkup = `<img src="${item.image}" alt="${item.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; margin-right: 0.75rem;" onerror="this.onerror=null; this.outerHTML='<span style=&quot;font-size:2.5rem; margin-right:0.75rem;&quot;>📦</span>';">`;
        } else {
          imgMarkup = `<span style="font-size: 2.5rem; margin-right: 0.75rem;">${item.image || '📦'}</span>`;
        }

        itemsHtml += `
          <div class="cart-item">
            ${imgMarkup}
            <div class="cart-item-info">
              <h4 style="font-weight: 700; font-size: 1.05rem;">${item.name}</h4>
              <p style="color: var(--text-secondary); font-size: 0.85rem;">Price: ₹${item.price.toFixed(2)}</p>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem; margin-right: 2rem;">
              <span style="font-size: 0.95rem; color: var(--text-secondary);">Qty:</span>
              <strong style="font-size: 1.05rem;">${item.quantity}</strong>
            </div>
            <div class="cart-item-price" style="margin-right: 1.5rem; font-size: 1.05rem;">
              ₹${(item.price * item.quantity).toFixed(2)}
            </div>
            <button class="btn btn-secondary remove-item-btn" data-id="${item.productId}" style="padding: 0.4rem; border-radius: 6px; color: var(--accent-danger);">
              ✕ Remove
            </button>
          </div>
        `;
      });

      const total = state.getCartTotal();

      container.innerHTML = `
        <div class="cart-items-list">
          ${itemsHtml}
          <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
            <button class="btn btn-secondary" id="clear-cart-btn" style="color: var(--accent-danger);">
              Clear All Cart Items
            </button>
          </div>
        </div>
        
        <div class="card cart-summary">
          <h3 class="card-title">Order Summary</h3>
          <p class="card-desc">Review your checkout total details.</p>
          
          <div class="summary-row">
            <span>Subtotal</span>
            <span>₹${total.toFixed(2)}</span>
          </div>
          <div class="summary-row" style="color: var(--accent-success);">
            <span>Shipping</span>
            <span>FREE</span>
          </div>
          <div class="summary-row summary-total">
            <span>Total</span>
            <span>₹${total.toFixed(2)}</span>
          </div>
          
          <button class="btn btn-primary" id="checkout-btn" style="width: 100%; margin-top: 1.5rem;">
            Proceed to Checkout
          </button>
        </div>
      `;

      // Event listeners for remove buttons
      container.querySelectorAll('.remove-item-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          state.removeFromCart(id);
          updateCartCount();
          renderCart();
        });
      });

      // Clear cart
      const clearBtn = document.getElementById('clear-cart-btn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          if (confirm('Clear entire cart?')) {
            state.clearCart();
            updateCartCount();
            renderCart();
          }
        });
      }

      // Proceed to checkout redirect
      const checkoutBtn = document.getElementById('checkout-btn');
      if (checkoutBtn) {
        checkoutBtn.addEventListener('click', () => {
          window.location.href = '/pages/checkout.html';
        });
      }
    };

    renderCart();
  </script>
</body>
</html>
